services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scubaxcursions
      POSTGRES_PASSWORD: scubax_local_dev_password
      POSTGRES_DB: scubaxcursions
    ports:
      - "127.0.0.1:${SCUBAX_DB_PORT:-5433}:5432"
    volumes:
      - scubax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scubaxcursions -d scubaxcursions"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  scubax_postgres_data:
